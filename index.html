<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Ultimate Windows Archive</title>
    <style>
        :root {
            --bg-dark: #111111;
            --box-bg: #1e1e1e;
            --text-main: #f0f0f0;
            --text-muted: #aaaaaa;
            --win-blue: #0078d4;
            --win-blue-hover: #005a9e;
            --border-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .archive-box {
            background-color: var(--box-bg);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            width: 100%;
            max-width: 550px;
            border: 1px solid var(--border-color);
        }

        h1 {
            text-align: center;
            margin-top: 0;
            font-size: 24px;
        }

        p.description {
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 25px;
        }

        .step {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
        }

        select {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid var(--border-color);
            background-color: #2a2a2a;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        select:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        select:focus {
            outline: none;
            border-color: var(--win-blue);
        }

        .hidden {
            display: none;
        }

        #download-section {
            margin-top: 30px;
            text-align: center;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        .download-btn {
            display: inline-block;
            background-color: var(--win-blue);
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 16px;
            transition: background-color 0.2s;
        }

        .download-btn:hover {
            background-color: var(--win-blue-hover);
        }

        .warning-box {
            background-color: #332b00; 
            color: #ffcc00; 
            padding: 12px; 
            border-radius: 5px; 
            margin-top: 10px; 
            margin-bottom: 10px;
            font-size: 14px; 
            text-align: center; 
            border: 1px solid #ffcc00; 
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="archive-box">
        <h1>Ultimate Windows Archive</h1>
        <p class="description">Select your OS to find the official archive link.</p>

        <!-- Step 1: Version -->
        <div class="step">
            <label for="version-select">1. Choose Version</label>
            <select id="version-select">
                <option value="" disabled selected>-- Select an OS --</option>
            </select>
        </div>

        <div id="custom-message" class="warning-box hidden"></div>

        <!-- Step 2: Build -->
        <div class="step">
            <label for="build-select">2. Choose Build</label>
            <select id="build-select" disabled>
                <option value="" disabled selected>-- Select a Build --</option>
            </select>
        </div>

        <div id="build-message" class="warning-box hidden"></div>

        <!-- Step 3: Edition -->
        <div class="step hidden" id="edition-step">
            <label for="edition-select">3. Choose Edition</label>
            <select id="edition-select">
                <option value="" disabled selected>-- Select an Edition --</option>
            </select>
        </div>

        <!-- Step 4: Architecture -->
        <div class="step hidden" id="arch-step">
            <label for="arch-select">4. Choose Architecture</label>
            <select id="arch-select">
                <option value="" disabled selected>-- Select an Architecture --</option>
            </select>
        </div>

        <!-- The Final Download Link -->
        <div id="download-section" class="hidden">
            <a id="download-btn" class="download-btn" href="#" download>Download Build</a>
        </div>
    </div>

                }
            },
            "Windows NT 3.5 (Daytona)": {
                hasEditions: true,
                builds: {
                    "Build 612": { "Workstation": "#", "Server": "#" },
                    "Build 683 (Beta 2)": { "Workstation": "#", "Server": "#" },
                    "Build 807 (RTM)": { "Workstation": "#", "Server": "#" }
                }
            },
            "Windows NT 3.51": {
                hasEditions: true,
                builds: {
                    "Build 854": { "Workstation": "#", "Server": "#" },
                    "Build 944": { "Workstation": "#", "Server": "#" },
                    "Build 1057 (RTM)": { "Workstation": "#", "Server": "#" }
                }
            },
            "Windows NT 4.0 (Cairo/Shell Update)": {
                hasEditions: true,
                builds: {
                    "Build 1130": { "Workstation": "#", "Server": "#" },
                    "Build 1171": { "Workstation": "#", "Server": "#" },
                    "Build 1227": { "Workstation": "#", "Server": "#" },
                    "Build 1314": { "Workstation": "#", "Server": "#" },
                    "Build 1381 (RTM)": { "Workstation": "#", "Server": "#" }
                }
            }
        };

        // ==========================================
        // THE SMART ENGINE LOGIC
        // ==========================================

        const versionSelect = document.getElementById('version-select');
        const buildSelect = document.getElementById('build-select');
        const editionSelect = document.getElementById('edition-select');
        const archSelect = document.getElementById('arch-select');
        
        const editionStep = document.getElementById('edition-step');
        const archStep = document.getElementById('arch-step');
        const downloadSection = document.getElementById('download-section');
        
        const downloadBtn = document.getElementById('download-btn');
        const customMessage = document.getElementById('custom-message');
        const buildMessage = document.getElementById('build-message');

        // 1. Load Versions
        for (let os in windowsDatabase) {
            let option = document.createElement('option');
            option.value = os;
            option.textContent = os;
            versionSelect.appendChild(option);
        }

        // 2. Handle Version Change
        versionSelect.addEventListener('change', function() {
            let selectedOS = this.value;
            let osData = windowsDatabase[selectedOS];

            // Reset and hide everything downstream
            buildSelect.innerHTML = '<option value="" disabled selected>-- Select a Build --</option>';
            buildSelect.disabled = false;
            
            editionStep.classList.add('hidden');
            archStep.classList.add('hidden');
            downloadSection.classList.add('hidden');

            if (osData.message) {
                customMessage.innerHTML = osData.message;
                customMessage.classList.remove('hidden');
            } else {
                customMessage.classList.add('hidden');
            }

            buildMessage.classList.add('hidden');

            // Load Builds
            for (let buildName in osData.builds) {
                let option = document.createElement('option');
                option.value = buildName;
                option.textContent = buildName;
                buildSelect.appendChild(option);
            }
        });

        // 3. Handle Build Change
        buildSelect.addEventListener('change', function() {
            let selectedOS = versionSelect.value;
            let selectedBuild = this.value;
            let osData = windowsDatabase[selectedOS];
            let buildData = osData.builds[selectedBuild];

            // Hide downstream stuff
            archStep.classList.add('hidden');
            downloadSection.classList.add('hidden');

            if (osData.buildMessages && osData.buildMessages[selectedBuild]) {
                buildMessage.innerHTML = osData.buildMessages[selectedBuild];
                buildMessage.classList.remove('hidden');
            } else {
                buildMessage.classList.add('hidden');
            }

            // SMART LOGIC: Is it a string (link) or an object (editions)?
            if (typeof buildData === 'string') {
                editionStep.classList.add('hidden');
                showDownloadButton(buildData);
            } else {
                editionStep.classList.remove('hidden');
                editionSelect.innerHTML = '<option value="" disabled selected>-- Select an Edition --</option>';
                for (let editionName in buildData) {
                    let option = document.createElement('option');
                    option.value = editionName;
                    option.textContent = editionName;
                    editionSelect.appendChild(option);
                }
            }
        });

        // 4. Handle Edition Change
        editionSelect.addEventListener('change', function() {
            let selectedOS = versionSelect.value;
            let selectedBuild = buildSelect.value;
            let selectedEdition = this.value;
            let editionData = windowsDatabase[selectedOS].builds[selectedBuild][selectedEdition];

            // Hide download initially
            downloadSection.classList.add('hidden');

            // SMART LOGIC: Is it a string (link) or an object (architectures)?
            if (typeof editionData === 'string') {
                archStep.classList.add('hidden');
                showDownloadButton(editionData);
            } else {
                archStep.classList.remove('hidden');
                archSelect.innerHTML = '<option value="" disabled selected>-- Select an Architecture --</option>';
                for (let archName in editionData) {
                    let option = document.createElement('option');
                    option.value = archName;
                    option.textContent = archName;
                    archSelect.appendChild(option);
                }
            }
        });

        // 5. Handle Architecture Change
        archSelect.addEventListener('change', function() {
            let selectedOS = versionSelect.value;
            let selectedBuild = buildSelect.value;
            let selectedEdition = editionSelect.value;
            let selectedArch = this.value;
            
            let finalLink = windowsDatabase[selectedOS].builds[selectedBuild][selectedEdition][selectedArch];
            showDownloadButton(finalLink);
        });

        // Helper function
        function showDownloadButton(url) {
            downloadBtn.href = url;
            downloadSection.classList.remove('hidden');
        }
    </script>
</body>
</html>
