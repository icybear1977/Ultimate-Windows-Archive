<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Ultimate Windows Archive</title>
    <style>
        :root {
            /* Professional Steel & Charcoal Theme */
            --bg-color: #4a5568;
            --box-bg: #1a202c;
            --text-main: #edf2f7;
            --text-muted: #a0aec0;
            --win-blue: #4299e1;
            --border-color: #2d3748;
            --warn-yellow: rgba(255, 230, 0, 0.1);
            --warn-text: #ecc94b;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            color: var(--text-main);
        }

        .archive-box {
            background-color: var(--box-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 600px;
            border: 1px solid var(--border-color);
        }

        h1 { text-align: center; margin-top: 0; color: var(--win-blue); font-size: 28px; }
        p.description { text-align: center; color: var(--text-muted); font-size: 14px; margin-bottom: 30px; }

        .step { margin-bottom: 25px; }
        label { display: block; margin-bottom: 10px; font-weight: bold; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--win-blue); }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: #2d3748;
            color: white;
            font-size: 15px;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        select:focus { outline: none; border-color: var(--win-blue); }
        select:disabled { opacity: 0.3; cursor: not-allowed; }
        .hidden { display: none; }

        .warning-box {
            background: var(--warn-yellow);
            color: var(--warn-text); 
            padding: 18px; 
            border-radius: 8px; 
            margin: 20px 0;
            font-size: 14px; 
            text-align: center; 
            border: 1px solid rgba(236, 201, 75, 0.3);
            line-height: 1.6;
        }

        #download-section {
            margin-top: 35px;
            text-align: center;
            padding-top: 25px;
            border-top: 1px solid var(--border-color);
        }

        .download-btn {
            display: inline-block;
            background-color: var(--win-blue);
            color: white;
            text-decoration: none;
            padding: 15px 35px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 17px;
            transition: all 0.2s;
        }

        .download-btn:hover { background-color: #3182ce; transform: translateY(-2px); }

        .btn-link {
            background-color: var(--warn-text); 
            color: #000; 
            padding: 7px 14px; 
            text-decoration: none; 
            border-radius: 5px; 
            font-weight: bold; 
            display: inline-block;
            margin: 8px 5px 0 5px;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="archive-box">
        <h1>The Ultimate Windows Archive</h1>
        <p class="description">Historical builds, and boot media.</p>

        <!-- Step 1: Version Selection -->
        <div class="step">
            <label for="version-select">1. Operating System</label>
            <select id="version-select">
                <option value="" disabled selected>-- Select OS --</option>
            </select>
        </div>

        <div id="custom-message" class="warning-box hidden"></div>

        <!-- Step 2: Series Selection -->
        <div class="step hidden" id="update-step">
            <label for="update-select">2. Product Series</label>
            <select id="update-select"></select>
        </div>

        <!-- Step 3: Build Selection -->
        <div class="step">
            <label for="build-select">3. Select Build</label>
            <select id="build-select" disabled>
                <option value="" disabled selected>-- Select Build --</option>
            </select>
        </div>

        <div id="build-message" class="warning-box hidden"></div>

        <!-- Step 4: Edition Selection -->
        <div class="step hidden" id="edition-step">
            <label for="edition-select">4. Choose Edition</label>
            <select id="edition-select"></select>
        </div>

        <!-- Step 5: Architecture Selection -->
        <div class="step hidden" id="arch-step">
            <label for="arch-select">5. Architecture</label>
            <select id="arch-select"></select>
        </div>

        <div id="download-section" class="hidden">
            <a id="download-btn" class="download-btn" href="#" target="_blank">Download</a>
        </div>
    </div>

        const vSel = document.getElementById('version-select');
        const uSel = document.getElementById('update-select');
        const bSel = document.getElementById('build-select');
        const eSel = document.getElementById('edition-select');
        const aSel = document.getElementById('arch-select');
        const uStep = document.getElementById('update-step');
        const eStep = document.getElementById('edition-step');
        const aStep = document.getElementById('arch-step');
        const dlSec = document.getElementById('download-section');
        const dlBtn = document.getElementById('download-btn');
        const msgOS = document.getElementById('custom-message');
        const msgBuild = document.getElementById('build-message');

        for (let os in windowsDatabase) vSel.add(new Option(os, os));

        /**
         * STEP 1: VERSION SELECTION
         * Logic: Clears UI and displays persistent OS-level message.
         */
        vSel.onchange = function() {
            let os = windowsDatabase[this.value];
            resetUI('version');
            if (os.message) { 
                msgOS.innerHTML = os.message; 
                msgOS.classList.remove('hidden'); 
            } else { 
                msgOS.classList.add('hidden'); 
            }
            let updateKeys = Object.keys(os.updates);
            if (updateKeys.length > 1 || updateKeys[0] !== "Main Releases") {
                uStep.classList.remove('hidden');
                uSel.innerHTML = '<option value="" disabled selected>-- Select Series --</option>';
                updateKeys.forEach(k => uSel.add(new Option(k, k)));
            } else {
                loadBuilds(os.updates[updateKeys[0]]);
            }
        };

        /**
         * STEP 2: SERIES/UPDATE SELECTION
         */
        uSel.onchange = function() { loadBuilds(windowsDatabase[vSel.value].updates[this.value]); };

        /**
         * HELPER: LOAD BUILDS
         */
        function loadBuilds(buildData) {
            resetUI('update');
            bSel.innerHTML = '<option value="" disabled selected>-- Select Build --</option>';
            for (let b in buildData) bSel.add(new Option(b, b));
            bSel.disabled = false;
        }

        /**
         * STEP 3: BUILD SELECTION
         */
        bSel.onchange = function() {
            let os = windowsDatabase[vSel.value];
            let updateKey = uStep.classList.contains('hidden') ? Object.keys(os.updates)[0] : uSel.value;
            let buildData = os.updates[updateKey][this.value];
            if (os.buildMessages && os.buildMessages[this.value]) {
                msgBuild.innerHTML = os.buildMessages[this.value];
                msgBuild.classList.remove('hidden');
            } else {
                msgBuild.classList.add('hidden');
            }
            processStep(buildData, eStep, eSel, aStep);
        };

        /**
         * STEP 4: EDITION SELECTION
         */
        eSel.onchange = function() {
            let os = windowsDatabase[vSel.value];
            let updateKey = uStep.classList.contains('hidden') ? Object.keys(os.updates)[0] : uSel.value;
            processStep(os.updates[updateKey][bSel.value][this.value], aStep, aSel, null);
        };

        /**
         * STEP 5: ARCHITECTURE SELECTION
         */
        aSel.onchange = function() {
            let os = windowsDatabase[vSel.value];
            let updateKey = uStep.classList.contains('hidden') ? Object.keys(os.updates)[0] : uSel.value;
            let link = os.updates[updateKey][bSel.value][eSel.value][this.value];
            showDownload(link);
        };

        /**
         * CORE ENGINE: PROCESS STEP
         */
        function processStep(data, container, selector, hideOther) {
            if (hideOther) hideOther.classList.add('hidden');
            dlSec.classList.add('hidden');
            if (typeof data === 'string') {
                container.classList.add('hidden');
                showDownload(data);
            } else {
                container.classList.remove('hidden');
                selector.innerHTML = '<option value="" disabled selected>-- Select Option --</option>';
                for (let k in data) selector.add(new Option(k, k));
            }
        }

        /**
         * RESET UI
         */
        function resetUI(lvl) {
            if (lvl === 'version') uStep.classList.add('hidden');
            bSel.disabled = true;
            bSel.innerHTML = '<option value="" disabled selected>-- Select Build --</option>';
            eStep.classList.add('hidden');
            aStep.classList.add('hidden');
            dlSec.classList.add('hidden');
            msgBuild.classList.add('hidden'); 
        }

        /**
         * FINAL DOWNLOAD BUTTON
         */
        function showDownload(url) { 
            dlBtn.href = url; 
            dlSec.classList.remove('hidden'); 
        }
    </script>
</body>
</html>
